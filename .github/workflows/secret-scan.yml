name: Secret scan

# Scans every commit in the history for leaked keys and tokens with gitleaks, on
# each pull request and on each push to master. It runs for every path, since a
# secret can land in any file, and takes well under a minute. A finding fails
# the run, and the log shows the file and line with the value redacted.
#
# Known fixtures are listed by fingerprint in .gitleaksignore. To commit a new
# test key on purpose, end its line with a `gitleaks:allow` comment.
#
# The gitleaks binary comes from its GitHub release and runs only if it matches
# the SHA-256 pinned below. No third-party action and no secrets, so pull
# requests from forks run it safely.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
