name: Test

# Typecheck and tests, including the shared outcome event vectors, on pull
# requests that change code and on the merge into master, so the commit that
# ships has a run of its own. To keep Actions minutes low it runs only for code
# paths, cancels a superseded run, and stops at 10 minutes (a run takes about a
# minute). It uses no secrets, so pull requests from forks run it safely.
on:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
